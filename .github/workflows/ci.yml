name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:
  schedule:
    # Sanitisers, weekly. "From time to time" otherwise means never.
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: Gamoitsani.xcworkspace

jobs:
  # One job on purpose.
  #
  # This was previously split into Build and Test. Separate jobs get separate runners and
  # separate DerivedData, and `needs:` only orders them — it shares nothing. So the Test
  # job recompiled the entire app and every pod from scratch before running a suite that
  # takes under a minute, roughly doubling the runtime and the Actions minutes for no
  # added signal: `xcodebuild test` already fails the run if compilation fails.
  #
  # Handing DerivedData between jobs as an artifact was the alternative, but uploading and
  # downloading a multi-gigabyte build directory costs more than the rebuild it saves.
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Config.xcconfig
        # The real config is gitignored (ad unit IDs, mediation secrets). The committed
        # template carries Google's public AdMob *test* IDs, which is all CI needs — it
        # compiles the app, it never serves ads.
        #
        # It is a *base configuration reference*, so a missing file fails the build
        # outright, before a single file is compiled, rather than degrading to an empty
        # setting.
        run: |
          cp Gamoitsani2/Config.xcconfig.template \
             Gamoitsani2/Config.xcconfig

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install pods
        # Plain `pod install` resolves from the CocoaPods CDN and is much faster than
        # --repo-update, which re-syncs the whole spec repo on every run. Fall back only
        # if the lockfile references something the CDN lookup cannot satisfy.
        run: pod install || pod install --repo-update

      - name: Pick a simulator
        # Resolve whatever iPhone the runner actually has rather than hardcoding a name.
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(v['udid'] for rt in sorted(d) if 'iOS' in rt for v in d[rt] if 'iPhone' in v['name']))")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Verify the launch background
        # The launch screen colour cannot reference the design tokens — it is read from the
        # Info.plist before any code runs — so the value exists in two places. Cheap to
        # check, and the failure it prevents (a colour flash at launch) is easy to miss.
        run: ./scripts/verify-launch-background.swift

      - name: Verify localization keys
        # `l10n("...")` returns the key when it is missing, so a typo ships as a raw key on
        # screen instead of failing the build. Also surfaces keys nothing references any
        # more, which is how the strings from a deleted screen get noticed.
        run: ./scripts/verify-localization-keys.py

      - name: Build Gamoitsani2
        # Swift 6 language mode with complete strict concurrency, so a data-race
        # diagnostic fails the build rather than accumulating. The tests live in the
        # packages and run in the step below.
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme Gamoitsani2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test the 2.0 packages
        # Each package is independently testable — that is the point of the module split.
        # The design tokens carry WCAG contrast assertions, so a colour change that breaks
        # accessibility fails here.
        run: |
          set -o pipefail
          for pkg in GamoitsaniCore GamoitsaniEngine GamoitsaniDesign GamoitsaniData GamoitsaniL10n GamoitsaniAds GamoitsaniCapture; do
            echo "--- $pkg"
            ( cd "Libraries/Packages/$pkg" && xcodebuild test \
                -scheme "$pkg" \
                -destination "id=${{ steps.sim.outputs.udid }}" \
                CODE_SIGNING_ALLOWED=NO )
          done

      - name: Test the macro package
        # Separate from the loop above: a macro is a compiler plugin, so it builds for the
        # host toolchain and has no simulator destination to be given. `xcodebuild test`
        # against a simulator reports "not configured for the test action" here.
        run: |
          set -o pipefail
          ( cd Libraries/Packages/GamoitsaniMacros && swift test )

  # Kept off the push path: the sanitised suites take several times as long, and their
  # signal does not change commit to commit. Weekly, or on demand.
  #
  # This exists because a Swift access race in TeamDraw went unnoticed until the first
  # manual run — TSan reports that as "Swift access race", not "data race", so it also
  # slipped a grep looking only for the latter.
  sanitizers:
    name: Sanitizers
    runs-on: macos-15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(v['udid'] for rt in sorted(d) if 'iOS' in rt for v in d[rt] if 'iPhone' in v['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Thread and address sanitizers
        run: |
          set -o pipefail
          status=0
          for pkg in GamoitsaniCore GamoitsaniEngine GamoitsaniDesign GamoitsaniData GamoitsaniL10n GamoitsaniAds GamoitsaniCapture; do
            for flag in ThreadSanitizer AddressSanitizer; do
              echo "--- $pkg / $flag"
              log=$(mktemp)
              ( cd "Libraries/Packages/$pkg" && xcodebuild test \
                  -scheme "$pkg" \
                  -destination "id=${{ steps.sim.outputs.udid }}" \
                  "-enable${flag}" YES ) | tee "$log" || status=1
              # Both spellings: TSan says "data race" for memory and "Swift access race"
              # for an exclusivity violation, and the second one is easy to miss.
              if grep -qE "WARNING: ThreadSanitizer|ERROR: AddressSanitizer" "$log"; then
                echo "::error::$flag reported an issue in $pkg"
                status=1
              fi
            done
          done
          exit $status
