name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: Gamoitsani.xcworkspace
  SCHEME: Gamoitsani

jobs:
  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Config.xcconfig
        # The real config is gitignored (ad unit IDs, mediation secrets). The committed
        # template carries Google's public AdMob *test* IDs and placeholder collection
        # names, which is all CI needs — it compiles the app, it never serves ads.
        run: |
          cp Gamoitsani/Resources/Configuration/Config.xcconfig.template \
             Gamoitsani/Resources/Configuration/Config.xcconfig

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install pods
        run: pod install --repo-update

      - name: Build
        # `generic/platform=iOS Simulator` avoids pinning a device name that may not
        # exist on the runner image.
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 45
    needs: build
    # This job gates the pipeline: 38 passing, 6 skipped, 0 failing.
    #
    # The 6 skips are ChallengesManagerTests and two GameChallengeViewModelTests cases,
    # which need an injection seam on ChallengesManager that Phase 4 introduces. They
    # throw XCTSkip with that reason rather than failing silently.

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Config.xcconfig
        run: |
          cp Gamoitsani/Resources/Configuration/Config.xcconfig.template \
             Gamoitsani/Resources/Configuration/Config.xcconfig

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install pods
        run: pod install --repo-update

      - name: Pick a simulator
        # Resolve whatever iPhone the runner actually has rather than hardcoding a name.
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(v['udid'] for rt in sorted(d) if 'iOS' in rt for v in d[rt] if 'iPhone' in v['name']))")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        # Scoped to GamoitsaniTests deliberately. The UI test target is stock Xcode
        # boilerplate that asserts nothing, and running the whole scheme also runs
        # GamoitsaniUITests — which took over ten minutes and wrote ~4 GB of result
        # bundles before filling the disk on a dev machine. Add it back when the UI tests
        # test something.
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GamoitsaniTests \
            CODE_SIGNING_ALLOWED=NO
