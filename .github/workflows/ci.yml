name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: Gamoitsani.xcworkspace
  SCHEME: Gamoitsani

jobs:
  # One job on purpose.
  #
  # This was previously split into Build and Test. Separate jobs get separate runners and
  # separate DerivedData, and `needs:` only orders them — it shares nothing. So the Test
  # job recompiled the entire app and every pod from scratch before running a suite that
  # takes under a minute, roughly doubling the runtime and the Actions minutes for no
  # added signal: `xcodebuild test` already fails the run if compilation fails.
  #
  # Handing DerivedData between jobs as an artifact was the alternative, but uploading and
  # downloading a multi-gigabyte build directory costs more than the rebuild it saves.
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Config.xcconfig
        # The real config is gitignored (ad unit IDs, mediation secrets). The committed
        # template carries Google's public AdMob *test* IDs and placeholder collection
        # names, which is all CI needs — it compiles the app, it never serves ads.
        run: |
          cp Gamoitsani/Resources/Configuration/Config.xcconfig.template \
             Gamoitsani/Resources/Configuration/Config.xcconfig

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install pods
        # Plain `pod install` resolves from the CocoaPods CDN and is much faster than
        # --repo-update, which re-syncs the whole spec repo on every run. Fall back only
        # if the lockfile references something the CDN lookup cannot satisfy.
        run: pod install || pod install --repo-update

      - name: Pick a simulator
        # Resolve whatever iPhone the runner actually has rather than hardcoding a name.
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(v['udid'] for rt in sorted(d) if 'iOS' in rt for v in d[rt] if 'iPhone' in v['name']))")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # Compiles and tests in a single pass. Scoped to GamoitsaniTests deliberately: the
        # UI test target is stock Xcode boilerplate that asserts nothing, and running the
        # whole scheme also runs GamoitsaniUITests — which took over ten minutes and wrote
        # ~4 GB of result bundles before filling the disk on a dev machine. Add it back
        # when the UI tests test something.
        #
        # 38 pass, 6 skip, 0 fail. The skips are ChallengesManagerTests and two
        # GameChallengeViewModelTests cases, which need an injection seam on
        # ChallengesManager that Phase 4 introduces; they throw XCTSkip with that reason.
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GamoitsaniTests \
            CODE_SIGNING_ALLOWED=NO
